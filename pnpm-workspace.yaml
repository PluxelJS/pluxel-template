packages:
  - apps/**
  - packages/**
  - plugins/**
  # vendored/bundled packages (not real workspaces)
  - '!plugins/native/napi-rs/*__*'
  # product repos live elsewhere (downstream workspaces)
  - '!plugins/chatbots/**'
  - '!plugins/univer/**'

onlyBuiltDependencies:
  - esbuild
  - msgpackr-extract

public-hoist-pattern:
  - '@pluxel/core'
  - '@pluxel/hmr'
